<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Email Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center py-10 px-4">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gradient-to-r from-violet-600 to-indigo-600 px-8 py-6">
            <h1 class="text-3xl font-bold text-white text-center">HTML Email Sender</h1>
            <p class="text-indigo-100 text-center mt-2">Test your HTML email templates quickly and easily</p>
        </div>

        <div class="p-8">
            <form id="emailForm" class="space-y-6">

                <div>
                    <label for="toEmail" class="block text-sm font-semibold text-slate-700 mb-2">Recipient Email
                        Address</label>
                    <input type="email" id="toEmail" name="toEmail" required
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors shadow-sm text-slate-700"
                        placeholder="e.g., user@example.com">
                </div>

                <div>
                    <label for="htmlContent" class="block text-sm font-semibold text-slate-700 mb-2">HTML Content <span
                            class="text-xs text-slate-500 font-normal ml-2">(Max 5000 lines)</span></label>
                    <textarea id="htmlContent" name="htmlContent" rows="15" required
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors shadow-sm font-mono text-sm text-slate-700 resize-y"
                        placeholder="Paste your raw HTML code here..."></textarea>
                </div>

                <!-- Status Message -->
                <div id="statusMessage" class="hidden rounded-lg p-4 font-medium text-sm"></div>

                <div class="flex justify-end">
                    <button type="submit" id="sendBtn"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg shadow-md hover:shadow-lg transition-all flex items-center gap-2">
                        <span>Send Mail</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const sendBtn = document.getElementById('sendBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const toEmail = document.getElementById('toEmail').value;
            const htmlContent = document.getElementById('htmlContent').value;

            // UI Loading state
            const originalBtnText = sendBtn.innerHTML;
            sendBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Sending...`;
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-75', 'cursor-not-allowed');
            statusMessage.classList.add('hidden');

            let response;
            const requestOptions = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ toEmail, htmlContent })
            };

            try {
                try {
                    // First try localhost as requested
                    response = await fetch('http://localhost:3000/send-email', requestOptions);
                    if (!response.ok && response.status === 404) {
                        throw new Error('Endpoint not found');
                    }
                } catch (fallbackError) {
                    // If it fails, fallback to absolute URL
                    console.log("Localhost failed, falling back to absolute URL...");
                    response = await fetch('https://astro-pedia.onrender.com/send-email', requestOptions);
                }

                const data = await response.json();

                statusMessage.classList.remove('hidden', 'bg-red-50', 'text-red-700');

                if (response.ok) {
                    statusMessage.classList.add('bg-green-50', 'text-green-700');
                    statusMessage.innerHTML = '✅ ' + data.message;
                    // Optional: clear form
                    // document.getElementById('htmlContent').value = '';
                } else {
                    statusMessage.classList.add('bg-red-50', 'text-red-700');
                    statusMessage.innerHTML = '❌ ' + (data.message || 'Failed to send email');
                }
            } catch (error) {
                statusMessage.classList.remove('hidden', 'bg-green-50', 'text-green-700');
                statusMessage.classList.add('bg-red-50', 'text-red-700');
                statusMessage.innerHTML = '❌ Network error. Ensure server is running.';
            } finally {
                sendBtn.innerHTML = originalBtnText;
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });
    </script>
</body>

</html>
